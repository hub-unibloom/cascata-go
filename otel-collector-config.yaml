receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true
        cors:
          allowed_origins: ["*"]
          allowed_headers: ["X-Project-Slug", "X-API-Key", "Content-Type"]

processors:
  # Add project slug from header to resource attributes
  resource/add_project:
    attributes:
      - key: project.slug
        from_attribute: X-Project-Slug
        action: upsert

  # Batch processing for efficiency
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Memory limiter to prevent OOM
  memory_limiter:
    limit_mib: 512
    spike_limit_mib: 128
    check_interval: 5s

  # Routing by project slug (custom processor logic)
  # Note: In production, use a custom processor or attribute-based routing
  attributes/routing:
    actions:
      - key: routing.destination
        from_attribute: project.slug
        action: upsert

exporters:
  # Debug exporter for development
  debug:
    verbosity: detailed

  # File exporter for dead letter queue
  file/deadletter:
    path: /var/log/cascata/deadletter/deadletter.jsonl
    rotation:
      max_megabytes: 100
      max_days: 7
      max_backups: 5

  # # Datadog exporter - DESCOMENTE e configure DD_API_KEY para usar
  # # Exporte: export DD_API_KEY=sua_chave_aqui
  # datadog:
  #   api:
  #     key: ${DD_API_KEY}

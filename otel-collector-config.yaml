  #     source: cascata
  #     service: audit-logs
  #
  # # Splunk HEC exporter - DESCOMENTE e configure para usar
  # splunk_hec:
  #   token: ${SPLUNK_TOKEN}
  #   endpoint: ${SPLUNK_ENDPOINT}
  #   source: cascata
  #   sourcetype: _json
  #
  # # Loki exporter - DESCOMENTE e configure para usar
  # loki:
  #   endpoint: ${LOKI_ENDPOINT}
  #   labels:
  #     job: cascata-logs
  #     project: cascata
  #
  # # OTLP generic exporter - DESCOMENTE e configure para usar
  # otlp/external:
  #   endpoint: ${OTLP_EXTERNAL_ENDPOINT}
  #   headers:
  #     authorization: ${OTLP_EXTERNAL_AUTH}

extensions:
  # Health check endpoint
  health_check:
    endpoint: 0.0.0.0:13133

  # pprof for profiling
  pprof:
    endpoint: 0.0.0.0:1777

  # zpages for debugging
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/add_project, batch]
      exporters: [debug, file/deadletter]

  # Multi-tenant routing (conceptual - actual routing requires custom processor or multiple pipelines)
  # For production, use a custom processor that reads X-Project-Slug and routes accordingly
  # Or use multiple pipelines with filter processors based on resource attributes

  telemetry:
    logs:
      level: warn
